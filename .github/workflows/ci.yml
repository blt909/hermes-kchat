name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily drift check against hermes-agent main (03:00 UTC). Green -> the
    # drift job opens a pre-verified PR advancing the README pin.
    - cron: "0 3 * * *"

jobs:
  unit:
    name: Unit tests (fake adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest
      - name: Test
        run: pytest tests/unit -q

  functional:
    name: Functional tests (real hermes-agent adapter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Single source of truth: the README "Tested against" line drives the
      # exact hermes-agent commit under test. A stale/missing SHA fails here.
      - name: Resolve tested hermes-agent ref from README
        id: ref
        run: |
          SHA=$(sed -nE 's/.*commit `([0-9a-f]{7,40})` .*/\1/p' README.md | head -1)
          if [ -z "$SHA" ]; then
            echo "::error::README.md 'Tested against Hermes Agent commit <sha>' is missing or unparseable — refresh it."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout hermes-agent at tested ref
        env:
          HERMES_HOME: ${{ github.workspace }}/hermes-home
        run: |
          # GitHub sometimes 429s unauthenticated git RPCs — retry, the
          # alternative is a flaky CI (or a false drift alarm).
          for i in 1 2 3; do
            rm -rf "$HERMES_HOME/hermes-agent"
            if git clone --quiet --no-checkout --no-tags \
                  https://github.com/NousResearch/hermes-agent.git "$HERMES_HOME/hermes-agent" \
               && git -C "$HERMES_HOME/hermes-agent" fetch --quiet --depth 1 origin "${{ steps.ref.outputs.sha }}"; then
              git -C "$HERMES_HOME/hermes-agent" checkout --quiet "${{ steps.ref.outputs.sha }}"
              exit 0
            fi
            echo "hermes-agent checkout attempt $i failed (transient GitHub RPC?) — retrying in 5s"
            sleep 5
          done
          exit 1
      - name: Install deps
        run: pip install pytest aiohttp pyyaml python-dotenv
      - name: Test
        env:
          HERMES_HOME: ${{ github.workspace }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-home/hermes-agent
        run: pytest tests/functional -q

  drift:
    name: Drift check (hermes-agent @ main)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout hermes-agent main
        env:
          HERMES_HOME: ${{ github.workspace }}/hermes-home
        run: |
          for i in 1 2 3; do
            rm -rf "$HERMES_HOME/hermes-agent"
            if git clone --quiet --depth 1 \
                  https://github.com/NousResearch/hermes-agent.git "$HERMES_HOME/hermes-agent"; then
              exit 0
            fi
            echo "hermes-agent clone attempt $i failed (transient GitHub RPC?) — retrying in 5s"
            sleep 5
          done
          exit 1
      - name: Install deps
        run: pip install pytest aiohttp pyyaml python-dotenv
      - name: Test
        env:
          HERMES_HOME: ${{ github.workspace }}/hermes-home
          PYTHONPATH: ${{ github.workspace }}/hermes-home/hermes-agent
        run: pytest tests/functional -q
      - name: Open auto-update PR when the tested ref is behind main
        if: success()
        env:
          HERMES_HOME: ${{ github.workspace }}/hermes-home
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_SHA=$(git -C "$HERMES_HOME/hermes-agent" rev-parse HEAD)
          NEW_SHORT=${NEW_SHA:0:8}
          CUR=$(sed -nE 's/.*commit `([0-9a-f]{40})` .*/\1/p' README.md | head -1)
          echo "current pin: $CUR"
          echo "main head:   $NEW_SHA"
          if [ -z "$CUR" ]; then
            echo "::error::README 'Tested against' SHA missing — cannot auto-advance."
            exit 1
          fi
          if [ "$CUR" = "$NEW_SHA" ]; then
            echo "Already current — no PR needed."
            exit 0
          fi
          BRANCH="chore/advance-tested-against-$NEW_SHORT"
          if gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' | grep -q .; then
            echo "PR for $BRANCH already open."
            exit 0
          fi
          git config user.name "hermes-kchat bot"
          git config user.email "1004773+blt909@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only touch the "Tested against" line; the SHA is hex so it is
          # safe inside double quotes (no backticks involved).
          sed -i -E "/Tested against/ s/[0-9a-f]{40}/$NEW_SHA/" README.md
          grep -q "$NEW_SHA" README.md || { echo "::error::README pin not replaced"; exit 1; }
          git add README.md
          git commit -m "chore: advance tested-against to $NEW_SHA"
          git push -u origin "$BRANCH"
          gh pr create --title "chore: advance tested-against to $NEW_SHORT" \
            --body "Daily drift check passed against hermes-agent @ \`$NEW_SHA\`. This PR moves the 'Tested against' pin; CI on this PR re-verifies the same commit." \
            --base main --head "$BRANCH"
      - name: Report drift
        if: failure()
        run: |
          echo "::warning::hermes-agent @ main drifted: interface or behaviour changed."
          echo "Update README 'Tested against' and bump the plugin version if needed."